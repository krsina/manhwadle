# Minimal Supabase CLI config for manhwadle (schema + edge functions).
# Auth Site URL / Redirect URLs for hosted projects are set in the Dashboard:
#   Authentication → URL Configuration
#   - Site URL: http://localhost:5173 (local) or your production origin
#   - Redirect URLs (staging + production):
#       http://localhost:5173/**
#       https://*.pages.dev/**
#       https://<your-production-domain>/**
#   See docs/deployment.md

project_id = "snzhnkcccbxkwerbaido"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Local CLI defaults. Hosted staging/production allow-lists (incl. *.pages.dev)
# are configured in the Dashboard — see docs/deployment.md.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://*.pages.dev/**",
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Account export / self-service deletion (JWT required; user id from token only).
[functions.account-data]
verify_jwt = true

# Staff moderation API (JWT required; actor id from token only).
[functions.moderation]
verify_jwt = true

# Daily puzzle cron selector — custom CRON_SECRET / service-role auth in-function.
# Platform JWT verification must stay off or cron callers get 401 before the handler.
# See docs/deployment.md and docs/runbooks/daily-puzzles.md.
[functions.select-daily-puzzles]
verify_jwt = false

# Owner-only private downloads. Platform JWT check must stay off so callers
# without a session get the function's own plain 404 (not a gateway 401).
# Auth happens in-function: owner session JWT vs PRIVATE_FILES_OWNER_ID.
[functions.private-files]
verify_jwt = false

# Optional: enable Before User Created Postgres hook after applying roles_moderation.
# Dashboard → Authentication → Hooks → Before User Created → hook_before_user_created
# Hosted projects: enable in Dashboard (cannot be committed for production).
# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/public/hook_before_user_created"
