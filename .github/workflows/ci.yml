# Quality gates only. Cloudflare Pages (Git integration) deploys:
#   - non-main branches / PRs → Preview (use staging Supabase env vars)
#   - main → Production
# Protect main so this `quality` job is required before merge — docs/deployment.md
name: CI

on:
  push:
    branches: [main, production-readiness]
    # Non-app paths: skip full quality (lint/tests/build/e2e). Mixed PRs with
    # src/public/supabase/etc. still run CI. Live avatar assets live under public/.
    paths-ignore:
      - 'docs/**'
      - 'art/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'art/**'
      - '**.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      - name: Secret scan
        run: npm run check:secrets

      - name: Migration timestamp uniqueness
        run: npm run check:migrations

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dist artifact + budget checks
        run: npm run check:dist

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-cw

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Playwright critical paths
        run: npm run test:e2e

  # Auth / moderation flows that need a live staging project.
  # Enable by setting repository variables and secrets, then remove `if: false`.
  staging-smoke:
    if: false
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Documented staging live smokes
        run: |
          echo "Configure STAGING_SUPABASE_* secrets only (never production), then run:"
          echo "  npm run test:live"
          echo "  npm run test:live:auth"
          echo "  npm run test:live:security   # requires SECURITY_SMOKE_TARGET + ACK; fail-closed"
          echo "See docs/moderation.md, docs/deployment.md, docs/runbooks/security-negatives-staging.md"
          echo "Do not enable this job against production credentials."
