<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manhwadle - daily manhwa guessing game</title>
    <meta
      name="description"
      content="Manhwadle is a daily Wordle-style guessing game for manhwa. Play Summary, Character, Cover, and Heardle modes."
    />
    <link rel="canonical" href="https://manhwadle.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Manhwadle" />
    <meta property="og:title" content="Manhwadle - daily manhwa guessing game" />
    <meta
      property="og:description"
      content="Guess today’s manhwa from summary, character, cover, or song clues. Four daily modes."
    />
    <meta property="og:url" content="https://manhwadle.net/" />
    <meta property="og:image" content="https://manhwadle.net/og-share.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Manhwadle - daily manhwa guessing game" />
    <meta
      name="twitter:description"
      content="Guess today’s manhwa from summary, character, cover, or song clues. Four daily modes."
    />
    <meta name="twitter:image" content="https://manhwadle.net/og-share.svg" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Inline theme boot is required to avoid a flash of the wrong theme before React hydrates.
      It only reads localStorage and sets data-theme / color-scheme. CSP allows this exact
      pattern via a narrow script-src 'unsafe-inline' exception documented in public/_headers.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('manhwadle:theme')
          if (theme !== 'light' && theme !== 'dark') theme = 'dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
